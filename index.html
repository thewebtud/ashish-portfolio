<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060a14" />
    <script>
      // Applies the theme before first paint to avoid a flash. Keep in sync with src/theme/theme.ts.
      ;(function () {
        try {
          var theme = null
          try {
            theme = localStorage.getItem('portfolio-theme')
          } catch (e) {}
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f8fc' : '#060a14')
        } catch (e) {}
      })()
    </script>
    <title>Ashish Kumar | Lead Frontend Developer</title>
    <meta
      name="description"
      content="Portfolio of Ashish Kumar, a Lead Frontend Developer with 8+ years building scalable React and TypeScript applications, AI-powered products and data-rich dashboards."
    />
    <meta name="author" content="Ashish Kumar" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ashish Kumar" />
    <meta property="og:title" content="Ashish Kumar | Lead Frontend Developer" />
    <meta
      property="og:description"
      content="8+ years building scalable React and TypeScript applications, AI-powered products and data-rich dashboards."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:alt" content="Portrait of Ashish Kumar, Lead Frontend Developer" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ashish Kumar | Lead Frontend Developer" />
    <meta
      name="twitter:description"
      content="8+ years building scalable React and TypeScript applications, AI-powered products and data-rich dashboards."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view Ashish Kumar's portfolio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
